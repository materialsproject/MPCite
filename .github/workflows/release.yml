name: release

on:
  push:
    branches: [release-workflow]
  
  workflow_dispatch:
    inputs:
      control:
        required: true
        description: if buildSiteOnly, then only builds site. If publishAndBuild is selected, then publish to TestPyPi and Build.
        type: choice
        options:
          - buildSiteOnly
          - publishAndBuild
  
  release:
    types: [published]

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || ${{ github.event.inputs.control == 'publishAndBuild'}}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mp-cite/
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install build dependencies
        run: uv sync --all-extras

      # should I uv version --bump patch here?

      - name: Build the project
        run: uv build

      - name: Publish to TestPyPI
        env:
          TESTPYPI_TOKEN_SCOPED_MPCITE: ${{ secrets.TESTPYPI_TOKEN_SCOPED_MPCITE }}
        run: |
          uv publish --index "testpypi" --token $TESTPYPI_TOKEN_SCOPED_MPCITE
          # echo Temporary Placeholder For Publish. Branch: ${GITHUB_REF##*/}

  docs:
    runs-on: ubuntu-latest
    needs:
      - publish

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12

      - name: Install deps
        run: |
            uv sync --locked --all-extras --dev

      - name: Generate changelog
        uses: charmixer/auto-changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude_labels: dependencies

      - name: Commit files
        run: |
          git config --local user.email "feedback@materialsproject.org"
          git config --local user.name "materialsproject"
          git stash
          git pull origin ${GITHUB_REF##*/}
          mv CHANGELOG.md docs/
          git add docs/CHANGELOG.md && git diff-index --quiet HEAD || git commit -m 'Updated CHANGELOG.md'

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Build and Deploy!
        run: |
          uvx mkdocs gh-deploy

